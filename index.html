<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Yumisora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    ::selection {
      background: rgba(245, 184, 201, 0.28);
      color: #ffffff;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #090d0e;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #f2f5f7;
      user-select: none;
      -webkit-user-select: none;
    }

    .bg {
      position: fixed;
      inset: -30px;
      background: 
        linear-gradient(180deg, rgba(8, 12, 14, 0.35) 0%, rgba(5, 8, 10, 0.65) 100%),
        var(--bg-img) center / cover no-repeat;
      filter: brightness(0.84) contrast(1.06);
      z-index: 0;
      transform: scale(1.03);
    }

    .bg::after {
      content: "";
      position: absolute;
      inset: -20%;
      background: 
        radial-gradient(circle at 30% 50%, rgba(210, 225, 230, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 70% 60%, rgba(200, 220, 225, 0.06) 0%, transparent 45%);
      filter: blur(40px);
      animation: mistDrift 28s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes mistDrift {
      0%   { transform: translate(-4%, 2%) scale(1); }
      100% { transform: translate(5%, -3%) scale(1.08); }
    }

    #rainBg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .stage {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1400px;
      padding: 20px;
    }

    .card-wrap {
      width: min(475px, 92vw);
      aspect-ratio: 1.586 / 1;
      position: relative;
      cursor: grab;
      touch-action: none;
    }

    .card-wrap:active {
      cursor: grabbing;
    }

    .face {
      position: absolute;
      inset: 0;
      border-radius: 24px;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.1) 0%,
        rgba(255, 255, 255, 0.02) 50%,
        rgba(255, 255, 255, 0.06) 100%
      );
      backdrop-filter: blur(7px) saturate(135%) brightness(1.08);
      -webkit-backdrop-filter: blur(7px) saturate(135%) brightness(1.08);
      box-shadow: 
        0 28px 60px -12px rgba(0, 0, 0, 0.55),
        0 4px 16px rgba(0, 0, 0, 0.25),
        inset 0 1.5px 2px 0 rgba(255, 255, 255, 0.45),
        inset 0 -1px 2px 0 rgba(255, 255, 255, 0.15),
        inset 1px 0 2px 0 rgba(255, 255, 255, 0.2),
        inset -1px 0 2px 0 rgba(0, 0, 0, 0.2);
      overflow: hidden;
      will-change: transform, opacity;
      transition: box-shadow 0.3s ease;
    }

    .face::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(
        380px circle at var(--lx, 50%) var(--ly, 20%),
        rgba(255, 255, 255, 0.16),
        transparent 60%
      );
      pointer-events: none;
      z-index: 1;
    }

    .face::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 24px;
      padding: 1px;
      background: linear-gradient(
        140deg,
        rgba(255, 255, 255, 0.5) 0%,
        rgba(255, 255, 255, 0.08) 40%,
        rgba(255, 255, 255, 0.03) 70%,
        rgba(255, 255, 255, 0.28) 100%
      );
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      z-index: 4;
    }

    .drops-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 3;
    }

    .content {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      padding: 26px 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .top-bar {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .avatar-wrap {
      width: 74px;
      height: 74px;
      border-radius: 16px;
      padding: 2px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.05));
      box-shadow: 
        0 10px 24px rgba(0, 0, 0, 0.28),
        0 0 0 1px rgba(255, 255, 255, 0.25),
        inset 0 1px 2px rgba(255, 255, 255, 0.4);
      flex-shrink: 0;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s ease;
    }

    .avatar-wrap:hover {
      transform: scale(1.04) translateY(-2px);
      box-shadow: 
        0 14px 28px rgba(0, 0, 0, 0.38),
        0 0 0 1px rgba(255, 255, 255, 0.45),
        inset 0 1px 2px rgba(255, 255, 255, 0.5);
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 14px;
      object-fit: cover;
      display: block;
    }

    .identity {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .name-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .name {
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
    }

    .status-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: rgba(255, 255, 255, 0.9);
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.22);
      padding: 3px 9px;
      border-radius: 99px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      backdrop-filter: blur(4px);
    }

    .status-pill:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: translateY(-1px);
    }

    .specs {
      display: flex;
      flex-direction: column;
      gap: 7px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      margin-top: 4px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
    }

    .spec-row {
      display: flex;
      align-items: baseline;
      line-height: 1.4;
    }

    .spec-key {
      width: 58px;
      flex-shrink: 0;
      color: rgba(255, 255, 255, 0.58);
      font-weight: 400;
    }

    .spec-val {
      color: rgba(255, 255, 255, 0.96);
      font-weight: 400;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: rgba(255, 255, 255, 0.65);
      border-top: 1px solid rgba(255, 255, 255, 0.14);
      padding-top: 10px;
    }

    .swipe-hint {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .swipe-hint span {
      display: inline-block;
      transition: color 0.3s ease, text-shadow 0.3s ease;
    }

    @keyframes swipePulse {
      0%, 100% {
        transform: translateX(0);
        color: rgba(255, 255, 255, 0.65);
      }
      35% {
        transform: translateX(-6px);
        color: #ffffff;
        text-shadow: 0 0 12px rgba(255, 255, 255, 0.8);
      }
      70% {
        transform: translateX(3px);
        color: #ffffff;
      }
    }

    .nudge-active {
      animation: swipePulse 1.2s ease-in-out 2;
    }

    .term {
      font-family: 'JetBrains Mono', monospace;
      justify-content: flex-start;
      gap: 10px;
      padding: 22px 26px;
    }

    .term-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
      padding-bottom: 8px;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.85);
    }

    .prompt {
      color: #a9dfbf;
    }

    .cmd {
      color: #ffffff;
    }

    .cursor {
      display: inline-block;
      width: 6px;
      height: 13px;
      background: #f5b8c9;
      vertical-align: middle;
      margin-left: 3px;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .term-body {
      display: grid;
      grid-template-columns: 165px 1fr;
      gap: 16px;
      align-items: center;
      height: 100%;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .term-body.show {
      opacity: 1;
      transform: translateY(0);
    }

    .bonsai-box {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.54rem;
      line-height: 1.05;
      white-space: pre;
      letter-spacing: 0;
      user-select: none;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.45));
    }

    .b-wood { color: #c89f81; }
    .b-sak1 {
      color: #ffd6e4;
      text-shadow: 0 0 8px rgba(255, 182, 209, 0.45);
    }
    .b-sak2 {
      color: #f49cbb;
      text-shadow: 0 0 6px rgba(244, 156, 187, 0.3);
    }
    .b-sak3 {
      color: #d46a8e;
      text-shadow: 0 0 5px rgba(212, 106, 142, 0.25);
    }
    .b-pot  { color: rgba(255, 255, 255, 0.55); }
    .b-grass { color: #8fbc94; }

    .info {
      font-size: 0.78rem;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .info-hdr {
      color: #f5b8c9;
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 1px;
    }

    .info-sep {
      color: rgba(255, 255, 255, 0.22);
      margin-bottom: 10px;
      font-size: 0.7rem;
    }

    .soc-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .soc-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.78rem;
    }

    .soc-row svg {
      width: 16px;
      height: 16px;
      fill: rgba(255, 255, 255, 0.75);
      flex-shrink: 0;
      filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.3));
    }

    .soc-row a {
      position: relative;
      color: rgba(255, 255, 255, 0.92);
      text-decoration: none;
      transition: color 0.2s;
    }

    .soc-row a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -2px;
      width: 100%;
      height: 1px;
      background: #f5b8c9;
      transform: scaleX(0);
      transform-origin: right;
      transition: transform 0.25s ease;
    }

    .soc-row a:hover {
      color: #f5b8c9;
    }

    .soc-row a:hover::after {
      transform: scaleX(1);
      transform-origin: left;
    }

    .soc-row .soon {
      color: rgba(255, 255, 255, 0.45);
    }

    .sound-toggle {
      position: fixed;
      bottom: 22px;
      right: 24px;
      z-index: 10;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.14) 0%,
        rgba(255, 255, 255, 0.03) 50%,
        rgba(255, 255, 255, 0.08) 100%
      );
      backdrop-filter: blur(8px) saturate(140%) brightness(1.08);
      -webkit-backdrop-filter: blur(8px) saturate(140%) brightness(1.08);
      border: 1px solid rgba(255, 255, 255, 0.28);
      box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.35),
        inset 0 1px 1.5px rgba(255, 255, 255, 0.45),
        inset 0 -1px 1px rgba(0, 0, 0, 0.2);
      color: rgba(255, 255, 255, 0.85);
      cursor: pointer;
      transition: transform 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    .sound-toggle:hover {
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.48);
      transform: scale(1.05);
    }

    .sound-toggle:active {
      transform: scale(0.95);
    }

    .sound-toggle svg {
      width: 17px;
      height: 17px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @media (max-width: 480px) {
      .content { padding: 18px 20px; }
      .avatar-wrap { width: 58px; height: 58px; }
      .name { font-size: 1.25rem; }
      .specs { font-size: 0.7rem; gap: 4px; }
      .spec-key { width: 48px; }
      .term-body { grid-template-columns: 130px 1fr; gap: 8px; }
      .bonsai-box { font-size: 0.44rem; }
      .info, .soc-row { font-size: 0.68rem; }
    }
  </style>
</head>
<body>

  <canvas id="rainBg"></canvas>

  <main class="stage">

          <div class="specs">

              <span class="spec-key">do :</span>

            <div class="spec-row">
              <span class="spec-key">lang :</span>
              <span class="spec-val">rust, c++, c#, python, java, node.js, html</span>
            </div>
            <div class="spec-row">
              <span class="spec-key">IDE :</span>

            <div class="swipe-hint">

      </section>

      <section class="face" id="back" style="opacity: 0; pointer-events: none;">
        <canvas class="drops-canvas" id="dropsBack"></canvas>
        <div class="content term">
          <div class="term-bar">
            <div>
              <span class="prompt">yumisora ~ $ </span><span class="cmd" id="typedCmd"></span><span class="cursor"></span>
            </div>
            <span style="opacity:0.45">zsh</span>
          </div>

          <div class="term-body" id="backWrap">

            <div class="info">

      </section>

    </div>
  </main>

  <button class="sound-toggle" id="soundBtn" aria-label="Toggle rain sound">
    <svg id="svgSoundOff" viewBox="0 0 24 24">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <line x1="23" y1="9" x2="17" y2="15"></line>
      <line x1="17" y1="9" x2="23" y2="15"></line>
    </svg>
    <svg id="svgSoundOn" viewBox="0 0 24 24" style="display:none">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
    </svg>
  </button>

  <script>
    const BG_SRC = 'https://wsrv.nl/?url=https://files.catbox.moe/tyxu2k.jpg';
    document.documentElement.style.setProperty('--bg-img', `url('${BG_SRC}')`);

    const kaomojiEl = document.getElementById('kaomoji');
    const faces = ['( >_< )', '( ⁄>⁄▽⁄<⁄ )', '( ˘︹˘ )', '( ¬_¬ )', '( ◕‿◕ )'];
    let faceIdx = 0;
    kaomojiEl.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      faceIdx = (faceIdx + 1) % faces.length;
      kaomojiEl.textContent = faces[faceIdx];
    });

    const cardWrap = document.getElementById('cardWrap');
    const frontEl = document.getElementById('front');
    const backEl = document.getElementById('back');
    const swipeTextEl = document.getElementById('swipeText');

    let isFlipped = false;
    let hasEverFlipped = false;
    let dragging = false;
    let startX = 0, startY = 0;

    let rx = 0, ry = 0;
    let tx = 0, ty = 0;
    let vx = 0, vy = 0;

    let tiltX = 0, tiltY = 0;

    cardWrap.addEventListener('pointerdown', (e) => {
      if (e.target.closest('a') || e.target.closest('#kaomoji')) return;
      dragging = true;
      startX = e.clientX;
      startY = e.clientY;
      cardWrap.setPointerCapture(e.pointerId);
    });

    window.addEventListener('pointermove', (e) => {
      const rect = cardWrap.getBoundingClientRect();
      const lx = ((e.clientX - rect.left) / rect.width) * 100;
      const ly = ((e.clientY - rect.top) / rect.height) * 100;
      frontEl.style.setProperty('--lx', `${lx}%`);
      frontEl.style.setProperty('--ly', `${ly}%`);
      backEl.style.setProperty('--lx', `${lx}%`);
      backEl.style.setProperty('--ly', `${ly}%`);

      if (!dragging) {
        if (
          e.clientX >= rect.left - 60 && e.clientX <= rect.right + 60 &&
          e.clientY >= rect.top - 60 && e.clientY <= rect.bottom + 60
        ) {
          const cx = rect.left + rect.width / 2;
          const cy = rect.top + rect.height / 2;
          tiltY = ((e.clientX - cx) / (rect.width / 2)) * 7;
          tiltX = -((e.clientY - cy) / (rect.height / 2)) * 7;
        } else {
          tiltX = 0;
          tiltY = 0;
        }
        return;
      }

      const dx = e.clientX - startX;
      const dy = e.clientY - startY;

      ty = dx * 0.55;
      tx = -dy * 0.55;
    });

    function finishSwipe() {
      if (!dragging) return;
      dragging = false;

      const predictY = ry + vy * 6;
      const predictX = rx - vy * 6;

      if (Math.abs(predictY) > 38 || Math.abs(predictX) > 38) {
        isFlipped = !isFlipped;
        if (!hasEverFlipped) {
          hasEverFlipped = true;
          swipeTextEl.classList.remove('nudge-active');
        }
        if (isFlipped) {
          runBackTerminal();
        } else {
          resetBackTerminal();
        }
      }

      tx = 0;
      ty = 0;
    }

    window.addEventListener('pointerup', finishSwipe);
    window.addEventListener('pointercancel', finishSwipe);

    setTimeout(() => {
      if (!hasEverFlipped && !isFlipped && !dragging) {
        swipeTextEl.classList.add('nudge-active');
        ty = -34;
        tx = 6;
        setTimeout(() => {
          if (!dragging && !isFlipped) {
            ty = 12;
            tx = -3;
          }
        }, 380);
        setTimeout(() => {
          if (!dragging && !isFlipped) {
            ty = 0;
            tx = 0;
          }
        }, 760);
        setTimeout(() => {
          swipeTextEl.classList.remove('nudge-active');
        }, 2500);
      }
    }, 32000);

    function animateCard() {
      const targetX = tx + (dragging ? 0 : tiltX);
      const targetY = ty + (dragging ? 0 : tiltY);

      vx = (vx + (targetX - rx) * 0.1) * 0.78;
      vy = (vy + (targetY - ry) * 0.1) * 0.78;

      rx += vx;
      ry += vy;

      const crossed = Math.abs(rx) > 90 || Math.abs(ry) > 90;
      const showBack = isFlipped ? !crossed : crossed;

      const dispRx = showBack !== isFlipped ? rx + (rx > 0 ? -180 : 180) : rx;
      const dispRy = showBack !== isFlipped ? ry + (ry > 0 ? -180 : 180) : ry;

      const transformStr = `rotateX(${dispRx.toFixed(2)}deg) rotateY(${dispRy.toFixed(2)}deg)`;

      frontEl.style.transform = transformStr;
      backEl.style.transform = transformStr;

      if (showBack) {
        frontEl.style.opacity = '0';
        frontEl.style.pointerEvents = 'none';
        backEl.style.opacity = '1';
        backEl.style.pointerEvents = 'auto';
      } else {
        frontEl.style.opacity = '1';
        frontEl.style.pointerEvents = 'auto';
        backEl.style.opacity = '0';
        backEl.style.pointerEvents = 'none';
      }

      requestAnimationFrame(animateCard);
    }
    animateCard();

    const typedCmd = document.getElementById('typedCmd');
    const backWrap = document.getElementById('backWrap');
    const bonsaiBox = document.getElementById('bonsaiBox');

    let termTimeouts = [];
    let bonsaiInterval = null;

    function clearTermTimers() {
      termTimeouts.forEach(clearTimeout);
      termTimeouts = [];
      if (bonsaiInterval) {
        clearInterval(bonsaiInterval);
        bonsaiInterval = null;
      }
    }

    function resetBackTerminal() {
      clearTermTimers();
      typedCmd.textContent = '';
      backWrap.classList.remove('show');
      bonsaiBox.innerHTML = '';
    }

    function startSakuraBonsai() {
      const COLS = 29;
      const ROWS = 15;
      const grid = Array.from({ length: ROWS }, () =>
        Array.from({ length: COLS }, () => ({ ch: ' ', cls: '' }))
      );

      function setStr(r, c, str, cls) {
        if (r < 0 || r >= ROWS) return;
        for (let i = 0; i < str.length; i++) {
          if (c + i >= 0 && c + i < COLS) {
            grid[r][c + i] = { ch: str[i], cls };
          }
        }
      }

      setStr(ROWS - 3, 7, ':_____________:', 'b-pot');
      setStr(ROWS - 2, 7, ' \\___________/ ', 'b-pot');
      setStr(ROWS - 1, 7, '  (_)     (_)  ', 'b-pot');
      setStr(ROWS - 3, 8, '_.,-~-.,_.,-~', 'b-grass');

      const steps = [];

      function grow(x, y, dx, dy, life, depth) {
        if (life <= 0 || depth > 5) return;

        const cx = Math.round(x);
        const cy = Math.round(y);

        if (cy >= 1 && cy < ROWS - 3 && cx >= 1 && cx < COLS - 2) {
          let str = '|';
          if (dx < -0.25) str = '\\';
          else if (dx > 0.25) str = '/';
          if (life > 4) str = dx < -0.2 ? '\\|' : dx > 0.2 ? '|/' : '|/';
          steps.push({ type: 'wood', r: cy, c: cx, str });
        }

        const nx = x + dx;
        const ny = y + dy;

        if (life > 2 && Math.random() < 0.44) {
          const dir = Math.random() < 0.5 ? -1 : 1;
          grow(
            nx,
            ny,
            dx + dir * (0.45 + Math.random() * 0.45),
            -0.55 - Math.random() * 0.35,
            life - 2,
            depth + 1
          );
        }

        if (life <= 2) {
          const blossomChars = ['&', '@', '*', '%', '❀', '.'];
          const classes = ['b-sak1', 'b-sak2', 'b-sak3'];
          for (let i = 0; i < 9; i++) {
            const bx = Math.round(nx + (Math.random() - 0.5) * 6.2);
            const by = Math.round(ny + (Math.random() - 0.5) * 2.8);
            if (by >= 0 && by < ROWS - 3 && bx >= 0 && bx < COLS) {
              steps.push({
                type: 'leaf',
                r: by,
                c: bx,
                ch: blossomChars[Math.floor(Math.random() * blossomChars.length)],
                cls: classes[Math.floor(Math.random() * classes.length)]
              });
            }
          }
        } else {
          grow(
            nx,
            ny,
            dx + (Math.random() - 0.5) * 0.45,
            dy,
            life - 1,
            depth
          );
        }
      }

      grow(14, ROWS - 4, -0.15, -0.78, 8, 0);
      grow(13, ROWS - 6, -0.75, -0.6, 5, 1);
      grow(15, ROWS - 6, 0.75, -0.6, 5, 1);

      const petals = [];

      function renderBonsai() {
        let html = '';
        for (let r = 0; r < ROWS; r++) {
          let curCls = '';
          let spanText = '';
          for (let c = 0; c < COLS; c++) {
            let cell = grid[r][c];
            const p = petals.find(pt => Math.round(pt.r) === r && Math.round(pt.c) === c);
            if (p && cell.ch === ' ') {
              cell = { ch: p.ch, cls: 'b-sak1' };
            }
            if (cell.cls !== curCls) {
              if (spanText) {
                html += curCls ? `<span class="${curCls}">${spanText}</span>` : spanText;
              }
              curCls = cell.cls;
              spanText = cell.ch;
            } else {
              spanText += cell.ch;
            }
          }
          if (spanText) {
            html += curCls ? `<span class="${curCls}">${spanText}</span>` : spanText;
          }
          html += '\n';
        }
        bonsaiBox.innerHTML = html;
      }

      renderBonsai();

      let stepIdx = 0;
      bonsaiInterval = setInterval(() => {
        for (let k = 0; k < 2; k++) {
          if (stepIdx < steps.length) {
            const s = steps[stepIdx++];
            if (s.type === 'wood') {
              setStr(s.r, s.c, s.str, 'b-wood');
            } else if (s.type === 'leaf') {
              if (grid[s.r][s.c].ch === ' ' || grid[s.r][s.c].cls.startsWith('b-sak')) {
                grid[s.r][s.c] = { ch: s.ch, cls: s.cls };
              }
            }
          }
        }

        if (stepIdx >= steps.length) {
          for (let r = 0; r < ROWS - 3; r++) {
            for (let c = 0; c < COLS; c++) {
              if (grid[r][c].cls.startsWith('b-sak') && Math.random() < 0.015) {
                const classes = ['b-sak1', 'b-sak2', 'b-sak3'];
                grid[r][c].cls = classes[Math.floor(Math.random() * classes.length)];
              }
            }
          }
          if (petals.length < 3 && Math.random() < 0.25) {
            petals.push({
              r: 3 + Math.random() * 3,
              c: 6 + Math.random() * 16,
              ch: Math.random() < 0.5 ? '.' : '*'
            });
          }
          for (let i = petals.length - 1; i >= 0; i--) {
            petals[i].r += 0.22;
            petals[i].c += (Math.random() - 0.42) * 0.4;
            if (petals[i].r >= ROWS - 3) petals.splice(i, 1);
          }
        }

        renderBonsai();
      }, 36);
    }

    function runBackTerminal() {
      resetBackTerminal();
      const cmd = 'fastfetch';
      cmd.split('').forEach((ch, idx) => {
        termTimeouts.push(setTimeout(() => {
          typedCmd.textContent += ch;
        }, 120 + idx * 42));
      });

      termTimeouts.push(setTimeout(() => {
        backWrap.classList.add('show');
        startSakuraBonsai();
      }, 160 + cmd.length * 42));
    }

    const rainBg = document.getElementById('rainBg');
    const bgCtx = rainBg.getContext('2d');
    let bgW = 0, bgH = 0;
    let streaks = [];

    function resizeBg() {
      bgW = rainBg.width = window.innerWidth;
      bgH = rainBg.height = window.innerHeight;
      streaks = Array.from({ length: 110 }, () => ({
        x: Math.random() * bgW,
        y: Math.random() * bgH,
        len: 16 + Math.random() * 24,
        speed: 13 + Math.random() * 9,
        alpha: 0.07 + Math.random() * 0.16
      }));
    }
    window.addEventListener('resize', resizeBg);
    resizeBg();

    function drawBgRain() {
      bgCtx.clearRect(0, 0, bgW, bgH);
      bgCtx.lineWidth = 1;
      bgCtx.lineCap = 'round';
      for (const s of streaks) {
        bgCtx.strokeStyle = `rgba(210, 230, 245, ${s.alpha})`;
        bgCtx.beginPath();
        bgCtx.moveTo(s.x, s.y);
        bgCtx.lineTo(s.x - s.len * 0.14, s.y + s.len);
        bgCtx.stroke();

        s.y += s.speed;
        s.x -= s.speed * 0.14;
        if (s.y > bgH) {
          s.y = -s.len;
          s.x = Math.random() * (bgW + 120);
        }
      }
      requestAnimationFrame(drawBgRain);
    }
    drawBgRain();

    const bgImage = new Image();
    bgImage.crossOrigin = 'anonymous';
    bgImage.src = BG_SRC;

    function createGlassDrops(canvas) {
      const ctx = canvas.getContext('2d');
      let w = 0, h = 0;
      const drops = [];

      function resize() {
        const rect = canvas.getBoundingClientRect();
        w = canvas.width = rect.width || 475;
        h = canvas.height = rect.height || 300;
      }
      resize();
      window.addEventListener('resize', resize);

      function spawn(randomY = false) {
        const r = 1.4 + Math.pow(Math.random(), 2.3) * 4.6;
        drops.push({
          x: Math.random() * w,
          y: randomY ? Math.random() * h : -10,
          r,
          vy: 0,
          slipTimer: Math.random() * 100
        });
      }

      for (let i = 0; i < 38; i++) spawn(true);

      function drawDropPath(ctx, x, y, r, stretch) {
        const topY = y - r * (1 + stretch * 0.45);
        ctx.beginPath();
        ctx.moveTo(x, topY);
        ctx.bezierCurveTo(
          x + r * 0.85, y - r * 0.3,
          x + r * 1.05, y + r * 0.75,
          x, y + r
        );
        ctx.bezierCurveTo(
          x - r * 1.05, y + r * 0.75,
          x - r * 0.85, y - r * 0.3,
          x, topY
        );
        ctx.closePath();
      }

      function tick() {
        ctx.clearRect(0, 0, w, h);
        if (Math.random() < 0.2 && drops.length < 52) spawn(false);

        for (let i = drops.length - 1; i >= 0; i--) {
          const d = drops[i];

          if (d.r > 3.1) {
            d.slipTimer++;
            if (d.slipTimer > 45 && Math.random() < 0.08) {
              d.vy = (d.r - 2.6) * 0.32;
              d.slipTimer = 0;
            }
          }

          if (d.vy > 0.01) {
            d.y += d.vy;
            d.x += Math.sin(d.y * 0.14 + i) * 0.22;
            d.vy *= 0.96;

            if (Math.random() < 0.18 && d.r > 2.3) {
              drops.push({
                x: d.x + (Math.random() - 0.5) * 1.2,
                y: d.y - d.r * 1.3,
                r: 1.0 + Math.random() * 0.9,
                vy: 0,
                slipTimer: 0
              });
              d.r *= 0.985;
            }
          }

          for (let j = i - 1; j >= 0; j--) {
            const o = drops[j];
            const dx = d.x - o.x;
            const dy = d.y - o.y;
            const dist = Math.hypot(dx, dy);
            if (dist < (d.r + o.r) * 0.82) {
              const area = d.r * d.r + o.r * o.r;
              o.r = Math.min(6.4, Math.sqrt(area));
              o.vy = Math.max(o.vy, d.vy, 0.55);
              drops.splice(i, 1);
              break;
            }
          }

          if (d.y - d.r * 2 > h) {
            drops.splice(i, 1);
            continue;
          }

          const stretch = Math.min(1.6, d.vy * 1.4);

          ctx.save();
          ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
          drawDropPath(ctx, d.x + 0.6, d.y + 1.4, d.r, stretch);
          ctx.fill();

          drawDropPath(ctx, d.x, d.y, d.r, stretch);
          ctx.clip();

          if (bgImage.complete && bgImage.naturalWidth > 0) {
            const sx = ((d.x / w) * 0.6 + 0.2) * bgImage.naturalWidth;
            const sy = ((d.y / h) * 0.6 + 0.2) * bgImage.naturalHeight;
            ctx.drawImage(
              bgImage,
              sx - 35, sy - 35, 70, 70,
              d.x - d.r * 1.3, d.y - d.r * 2, d.r * 2.6, d.r * 3.2
            );
          }

          const grad = ctx.createLinearGradient(d.x - d.r, d.y - d.r, d.x + d.r, d.y + d.r);
          grad.addColorStop(0, 'rgba(15, 25, 32, 0.38)');
          grad.addColorStop(0.55, 'rgba(255, 255, 255, 0.05)');
          grad.addColorStop(1, 'rgba(225, 245, 255, 0.55)');
          ctx.fillStyle = grad;
          ctx.fillRect(d.x - d.r * 1.5, d.y - d.r * 2.2, d.r * 3, d.r * 3.5);
          ctx.restore();

          ctx.strokeStyle = 'rgba(255, 255, 255, 0.26)';
          ctx.lineWidth = 0.6;
          drawDropPath(ctx, d.x, d.y, d.r, stretch);
          ctx.stroke();

          ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
          ctx.beginPath();
          ctx.ellipse(
            d.x - d.r * 0.3,
            d.y - d.r * 0.28,
            Math.max(0.45, d.r * 0.22),
            Math.max(0.35, d.r * 0.14),
            -Math.PI / 4, 0, Math.PI * 2
          );
          ctx.fill();
        }

        requestAnimationFrame(tick);
      }
      tick();
    }

    createGlassDrops(document.getElementById('dropsFront'));
    createGlassDrops(document.getElementById('dropsBack'));

    const soundBtn = document.getElementById('soundBtn');
    const svgSoundOff = document.getElementById('svgSoundOff');
    const svgSoundOn = document.getElementById('svgSoundOn');
    let audioCtx = null;
    let masterGain = null;
    let isPlaying = false;
    let dropTimer = null;

    function updateSoundIcon(playing) {
      svgSoundOff.style.display = playing ? 'none' : 'block';
      svgSoundOn.style.display = playing ? 'block' : 'none';
    }

    function initRainAudio() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();

      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.001;
      masterGain.connect(audioCtx.destination);

      const bufferSize = audioCtx.sampleRate * 4;

      const pinkBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const pinkOut = pinkBuffer.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for (let i = 0; i < bufferSize; i++) {
        const white = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + white * 0.0555179;
        b1 = 0.99332 * b1 + white * 0.0750759;
        b2 = 0.96900 * b2 + white * 0.1538520;
        b3 = 0.86650 * b3 + white * 0.3104856;
        b4 = 0.55000 * b4 + white * 0.5329522;
        b5 = -0.7616 * b5 - white * 0.0168980;
        pinkOut[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.035;
        b6 = white * 0.115926;
      }

      const rainBody = audioCtx.createBufferSource();
      rainBody.buffer = pinkBuffer;
      rainBody.loop = true;

      const bodyFilter = audioCtx.createBiquadFilter();
      bodyFilter.type = 'bandpass';
      bodyFilter.frequency.value = 820;
      bodyFilter.Q.value = 0.65;

      const bodyGain = audioCtx.createGain();
      bodyGain.gain.value = 0.7;

      rainBody.connect(bodyFilter);
      bodyFilter.connect(bodyGain);
      bodyGain.connect(masterGain);
      rainBody.start();

      const whiteBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const whiteOut = whiteBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        whiteOut[i] = (Math.random() * 2 - 1) * 0.04;
      }

      const mistSrc = audioCtx.createBufferSource();
      mistSrc.buffer = whiteBuffer;
      mistSrc.loop = true;

      const mistHp = audioCtx.createBiquadFilter();
      mistHp.type = 'highpass';
      mistHp.frequency.value = 2600;

      const mistLp = audioCtx.createBiquadFilter();
      mistLp.type = 'lowpass';
      mistLp.frequency.value = 6200;

      const mistGain = audioCtx.createGain();
      mistGain.gain.value = 0.18;

      mistSrc.connect(mistHp);
      mistHp.connect(mistLp);
      mistLp.connect(mistGain);
      mistGain.connect(masterGain);
      mistSrc.start();

      const windSrc = audioCtx.createBufferSource();
      windSrc.buffer = pinkBuffer;
      windSrc.loop = true;

      const windFilter = audioCtx.createBiquadFilter();
      windFilter.type = 'lowpass';
      windFilter.frequency.value = 220;

      const lfo = audioCtx.createOscillator();
      lfo.frequency.value = 0.11;
      const lfoGain = audioCtx.createGain();
      lfoGain.gain.value = 95;
      lfo.connect(lfoGain);
      lfoGain.connect(windFilter.frequency);
      lfo.start();

      const windGain = audioCtx.createGain();
      windGain.gain.value = 0.55;

      windSrc.connect(windFilter);
      windFilter.connect(windGain);
      windGain.connect(masterGain);
      windSrc.start();

      dropTimer = setInterval(() => {
        if (!isPlaying || !audioCtx || audioCtx.state !== 'running') return;
        if (Math.random() < 0.55) {
          const now = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          const pan = audioCtx.createStereoPanner();

          const baseFreq = 1100 + Math.random() * 1900;
          osc.type = 'sine';
          osc.frequency.setValueAtTime(baseFreq, now);
          osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.48, now + 0.032);

          g.gain.setValueAtTime(0.0001, now);
          g.gain.linearRampToValueAtTime(0.008 + Math.random() * 0.014, now + 0.004);
          g.gain.exponentialRampToValueAtTime(0.0001, now + 0.038);

          pan.pan.value = (Math.random() - 0.5) * 1.4;

          osc.connect(g);
          g.connect(pan);
          pan.connect(masterGain);

          osc.start(now);
          osc.stop(now + 0.042);
        }
      }, 95);
    }

    function setSound(enable) {
      if (!audioCtx) initRainAudio();
      if (enable) {
        audioCtx.resume();
        masterGain.gain.setTargetAtTime(0.24, audioCtx.currentTime, 0.5);
        isPlaying = true;
        updateSoundIcon(true);
      } else {
        masterGain.gain.setTargetAtTime(0.0001, audioCtx.currentTime, 0.25);
        isPlaying = false;
        updateSoundIcon(false);
      }
    }

    soundBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      setSound(!isPlaying);
    });

    window.addEventListener('pointerdown', () => {
      if (!audioCtx) setSound(true);
    }, { once: true });
  </script>
</body>
